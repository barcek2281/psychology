Скопируй текст ниже, заполни поля и приложи лекции, конспекты или презентации.

---

Составь тесты для приложения «Зачёт» по приложенным учебным материалам.

Предмет: [название]
Постоянный ID предмета: [например, calculus-1]
Недели: [например, 1–6; укажи, какие материалы к какой неделе относятся]
Количество вопросов на неделю: [например, 15]
Язык вопросов: [русский / английский / язык материалов]
Цель: [еженедельный тест / midterm / final]

Работай только с предоставленными материалами. Не придумывай факты или ссылки. Если материалов не хватает либо распределение по неделям неоднозначно, сначала уточни это. Покрой основные темы каждой недели: определения, понимание и применение. Добавь правдоподобные неверные варианты, избегай двусмысленности и вопросов с очевидной подсказкой. Перемешивай позиции правильных вариантов. Проверь каждое решение самостоятельно.

Верни готовый UTF-8 файл .json. Если не можешь приложить файл, выведи только валидный JSON без Markdown, комментариев или вводного текста. Один файл — один предмет, в нём может быть несколько недель. Не добавляй ответы вне JSON.

Формат:

{
"schemaVersion": 1,
"subject": {
"id": "calculus-1",
"name": "Математический анализ",
"description": "Подготовка к файналу",
"color": "lavender",
"icon": "math",
"weeks": [
{
"id": "week-1",
"number": 1,
"title": "Производные",
"questions": [
{
"id": "w1-q1",
"type": "single",
"prompt": "Чему равна производная x²?",
"options": [
{ "id": "a", "text": "x" },
{ "id": "b", "text": "2x" },
{ "id": "c", "text": "x³ / 3" }
],
"correctAnswers": ["b"],
"explanation": "По правилу степени (xⁿ)′ = n·xⁿ⁻¹, поэтому (x²)′ = 2x."
},
{
"id": "w1-q2",
"type": "multiple",
"prompt": "У каких функций производная равна нулю на всей числовой прямой?",
"options": [
{ "id": "a", "text": "f(x) = 5" },
{ "id": "b", "text": "f(x) = x" },
{ "id": "c", "text": "f(x) = −2" }
],
"correctAnswers": ["a", "c"],
"explanation": "Производная постоянной равна нулю, а производная x равна 1."
},
{
"id": "w1-q3",
"type": "text",
"prompt": "Найди производную f(x) = 3x в точке x = 2. Введи число.",
"correctAnswers": ["3", "3.0", "3,0"],
"explanation": "Производная 3x равна 3 в любой точке."
}
]
}
]
}
}

Правила формата:

- schemaVersion всегда 1. color: mint, peach, lavender или blue. icon: code, math, database или book.
- Все id состоят из латинских букв, цифр, дефисов и подчёркиваний, длина 1–100. Сохраняй ID предмета, недель и уже существующих вопросов при дополнениях и исправлениях. Новым вопросам присваивай новые ID. Не используй ID демонстрационных предметов с префиксом demo-.
- weeks: от 1 до 100 недель. number — уникальное целое от 1 до 100. ID недель тоже уникальны внутри предмета.
- questions: от 1 до 1000 на неделю и не более 5000 на предмет. ID вопросов уникальны внутри недели.
- type single: от 2 до 8 вариантов options, correctAnswers содержит ровно один ID варианта.
- type multiple: от 2 до 8 вариантов, correctAnswers содержит все правильные ID без повторов. Оценка засчитывается только при точном совпадении всего набора, без частичного балла.
- type text: поле options отсутствует; correctAnswers содержит от 1 до 30 допустимых коротких ответов. Регистр, пробелы по краям, повторные пробелы и различие е/ё не учитываются. Иных преобразований нет: 0.5, 0,5 и 1/2 — разные строки, поэтому перечисли допустимые формы явно. Не задавай открытые эссе или вопросы, требующие смысловой оценки.
- Каждый вопрос обязательно содержит prompt, correctAnswers и explanation. Объяснение раскрывает ход решения и причину ошибки, а не просто повторяет ответ.
- Можно добавить source — строку с реальным названием лекции и страницей/слайдом; если источник неизвестен, поле пропусти. Не вставляй фиктивные ссылки.
- Текст — обычный Unicode. Для формул используй читаемые символы (x², √, ∈) и простой текст. HTML, Markdown и LaTeX не рендерятся. Для переноса строки внутри JSON используй \\n.
- Финальная проверка: JSON синтаксически валиден, все correctAnswers у single/multiple ссылаются на варианты, ID не повторяются, нумерация недель согласована, ответы проверены по материалам.

При дополнении существующего предмета можно вернуть только новые недели или вопросы. Приложение объединит данные по ID, сохранив остальные. Если поменяешь содержимое существующего вопроса, его прогресс сбросится. После проверки выдай JSON-файл.
